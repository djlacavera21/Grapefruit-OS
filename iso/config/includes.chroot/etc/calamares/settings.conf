# Grapefruit OS — Calamares settings (scaffold)
# This file is placed in the live image so that a future Calamares
# package can pick up Grapefruit-specific branding and module order.
#
# It is intentionally minimal. Full module configuration will be
# expanded once we decide on the exact installer experience.

modules-search: [ local, /usr/lib/calamares/modules ]

instances:

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: grapefruit

prompt-install: false
don't-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-sidebar: false
hide-back-and-next-during-exec: false
quit-at-end: false
