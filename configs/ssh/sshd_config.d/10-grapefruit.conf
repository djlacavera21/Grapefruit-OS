# Grapefruit OS — sshd hardening fragment
# Only relevant if the operator explicitly installs and enables openssh-server.
# This file is installed to /etc/ssh/sshd_config.d/ so it is easy to drop in.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 3
LoginGraceTime 30
